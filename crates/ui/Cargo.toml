[package]
name = "orlo-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GPUI editor views, workspace presentation, and widgets for Orlo"

[dependencies]
orlo-editor = { path = "../editor" }
orlo-workspace = { path = "../workspace" }
orlo-project = { path = "../project" }
orlo-git = { path = "../git" }
orlo-terminal = { path = "../terminal" }
orlo-syntax = { path = "../syntax" }
orlo-config = { path = "../config" }
orlo-utils = { path = "../utils" }
gpui.workspace = true
libc.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
orlo-editor = { path = "../editor", features = ["test-support"] }
orlo-workspace = { path = "../workspace", features = ["test-support"] }
orlo-project = { path = "../project", features = ["test-support"] }
orlo-syntax = { path = "../syntax", features = ["test-support"] }
orlo-config = { path = "../config", features = ["test-support"] }
orlo-utils = { path = "../utils", features = ["test-support"] }
syntect.workspace = true
unicode-segmentation.workspace = true
